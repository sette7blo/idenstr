# Idenstr local/self-hosted compose.
#
# Each *str app owns its own compose file and is independently deployable.
# Cross-app integration happens through URL + API token, not shared compose.

services:
  idenstr:
    image: dockersette/idenstr:latest
    container_name: idenstr
    restart: unless-stopped
    env_file: .env
    ports:
      - "${IDENSTR_HOST_PORT:-3000}:3000"
    volumes:
      - idenstr-data:/data

volumes:
  idenstr-data:
