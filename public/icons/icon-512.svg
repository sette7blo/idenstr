      <stop offset="0" stop-color="#b58cff"/>
      <stop offset="1" stop-color="#7c3cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#040208"/>
  <!-- crescent arc, gap at bottom-left -->
