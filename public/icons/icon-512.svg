  <!-- i dot -->
  <circle cx="215" cy="185" r="23" fill="#f4efff"/>
  <!-- i stem -->
  <line x1="215" y1="230" x2="215" y2="338" stroke="#f4efff" stroke-width="46" stroke-linecap="round"/>
  <!-- d stem (tall) -->
  <line x1="318" y1="155" x2="318" y2="338" stroke="#f4efff" stroke-width="46" stroke-linecap="round"/>
  <!-- d bowl -->
  <path d="M318 230 C246 230, 246 338, 318 338" fill="none" stroke="#f4efff" stroke-width="46" stroke-linecap="round"/>
  <!-- golden 4-pointed star at arc gap -->
