<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Idenstr">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b58cff"/>
      <stop offset="1" stop-color="#7c3cff"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="38" fill="#040208"/>
  <!-- crescent arc, gap at bottom-left -->
  <path d="M53 148 A69 69 0 1 1 45 112" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round"/>
  <!-- i dot -->
  <circle cx="76" cy="65" r="8" fill="#f4efff"/>
  <!-- i stem -->
  <line x1="76" y1="81" x2="76" y2="119" stroke="#f4efff" stroke-width="16" stroke-linecap="round"/>
  <!-- d stem (tall) -->
  <line x1="112" y1="55" x2="112" y2="119" stroke="#f4efff" stroke-width="16" stroke-linecap="round"/>
  <!-- d bowl -->
  <path d="M112 81 C87 81, 87 119, 112 119" fill="none" stroke="#f4efff" stroke-width="16" stroke-linecap="round"/>
  <!-- golden 4-pointed star at arc gap -->
  <path d="M46 138 l4.5-12.5 4.5 12.5 12.5 4.5-12.5 4.5-4.5 12.5-4.5-12.5-12.5-4.5z" fill="#f7931a"/>
</svg>
